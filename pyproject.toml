[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyramid-tiler"
version = "1.0.0"
description = "Local, deterministic image pyramid and tile generator (no network, no external services)"
requires-python = ">=3.10"
dependencies = ["Pillow>=9", "numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pyramid-tiler = "pyramid_tiler.cli:main"

[tool.setuptools]
packages = ["pyramid_tiler"]
